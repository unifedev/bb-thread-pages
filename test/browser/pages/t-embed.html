<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Embed test</title><style>body{font:15px system-ui;margin:1rem}#slot{height:420px;border:1px solid GrayText}iframe#own{width:100%;height:200px}</style></head>
<body><h1>Embed host page</h1><p id="hostmarker">host v1</p><div id="slot"></div>
<iframe id="own" sandbox="allow-same-origin allow-scripts allow-top-navigation allow-popups" allow="camera"></iframe>
<pre id="states"></pre><pre id="hostile"></pre>
<script>
window.__hostLoadedAt = Date.now(); window.__states = [];
const stop = threadPage.embed(document.getElementById('slot'), { sessionId: 'EMBEDDED_SESSION_ID', onState: s => { window.__states.push(s); document.getElementById('states').textContent = JSON.stringify(s); } });
threadPage.embed(document.getElementById('own'), { sessionId: 'EMBEDDED_SESSION_ID', path: 'second.html' });
window.__hostile = async (mode) => {
  const form = { submissionId: 'hostile-' + Date.now(), title: 'Forged', answers: [] };
  try {
    if (mode === 'forged') return await threadPage.invoke('pages.answer', { answerToken: 'aaaa.bbbb', form });
    if (mode === 'never-read') { // a token for B presented as if for another session: the page can only name a token, never a session
      return await threadPage.invoke('pages.answer', { answerToken: 'aaaa.bbbb', sessionId: 'THIRD_SESSION_ID', form }); }
    if (mode === 'other-target') { const r = await threadPage.invoke('pages.read', { pages: [{ sessionId: 'THIRD_SESSION_ID' }] }); const t = r.pages[0].answerToken; window.__otherTitle = r.pages[0].title; return await threadPage.invoke('pages.answer', { answerToken: t, form }); }
  } catch (e) { return { error: e.code, message: e.message }; }
};
</script></body></html>
