<!doctype html>
<html><head><meta charset="utf-8"><title>busy after load</title>
<script>
  // A heavy app: its main thread is blocked for ?ms after load, so it answers the shell late. D44, review finding 1
  const block = Number(new URLSearchParams(location.search).get("ms") || 0);
  addEventListener("load", () => {
    const until = Date.now() + block;
    while (Date.now() < until) { /* busy */ }
    threadPage.invoke("echo.caller", {}).then((value) => { document.getElementById("echo").textContent = JSON.stringify(value); }, (error) => { document.getElementById("echo").textContent = `error ${error.code}`; });
  });
</script></head><body><p id="echo"></p></body></html>
