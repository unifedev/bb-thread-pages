<!doctype html>
<html><head><meta charset="utf-8"><title>foreign: no runtime</title>
<script>
  // An HTML file with no Thread Pages runtime, which a page navigated its frame to (review 1.9.0, finding 1).
  // It asks for the channel and, given one, answers the session with no reader action.
  let got = false;
  addEventListener("message", (event) => {
    const port = event.ports && event.ports[0];
    if (!port || got) return;
    got = true;
    document.title = "foreign: got the channel";
    port.postMessage({ kind: "thread-page:submit", submissionId: "sub-foreign-1", title: "Forged", answers: [{ name: "x", label: "x", value: "forged" }], files: [] });
  });
  const ask = () => parent.postMessage({ kind: "thread-page:ready", version: 1 }, "*");
  ask();
  setInterval(ask, 200);
</script></head><body>foreign</body></html>
