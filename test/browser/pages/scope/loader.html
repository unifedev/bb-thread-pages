<!doctype html><html><head><meta charset="utf-8"><title>loader probe</title>
<script>
// A generic loader: scope first, then the app's markup swapped in. #…/write uses document.open instead, to show what that loses.
threadPage.setScope(decodeURIComponent(location.hash.slice(1)) || null);
const APP = `<!doctype html><html><head><title>app</title><script>window.appSaw = { scope: threadPage.scope };<\/script></head><body><p id="mode"></p><p id="app">app</p><a id="link" href="index.html">to index</a><form id="f"><input name="x" value="1"><button>Send</button></form></body></html>`;
const mode = location.hash.includes("write") ? "write" : "swap";
addEventListener("DOMContentLoaded", () => {
  if (mode === "write") { document.open(); document.write(APP); document.close(); }
  else {
    const parsed = new DOMParser().parseFromString(APP, "text/html");
    // Keep this head (the host's <base> and runtime live there); add the app's head, replace the body.
    document.head.append(...parsed.head.childNodes);
    document.body.replaceWith(parsed.body);
    for (const old of document.querySelectorAll("script")) { const s = document.createElement("script"); s.textContent = old.textContent; old.replaceWith(s); }
  }
  setTimeout(async () => {
    let echo; try { echo = await threadPage.invoke("echo.caller", {}); } catch (e) { echo = "error " + e.code; }
    document.title = JSON.stringify({ mode, appSaw: window.appSaw, scope: threadPage.scope, echo });
  }, 200);
});
</script></head><body>loading</body></html>
