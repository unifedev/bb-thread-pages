<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice and files (spec 1.5)</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 1.5rem; }
  textarea { display: block; width: 400px; height: 120px; font: inherit; color: rgb(20, 90, 40); }
  /* Hostile to the host's controls: none of these may reach them. A126, R4.57 */
  button { padding: 20px !important; background: rgb(255, 0, 0) !important; }
  svg { width: 100px !important; height: 100px !important; }
  body > :last-child, html > :last-child, thread-page-controls { display: none !important; }
  #after { margin-top: 0; }
  output { display: block; min-height: 1.2em; font-family: ui-monospace, monospace; font-size: 13px; }
  iframe.embed { width: 460px; height: 220px; border: 1px solid #aaa; }
</style>
</head>
<body>
<h1>Voice and files</h1>

<form id="answer" data-title="Voice pass">
  <label>Anything else <textarea name="notes" id="notes"></textarea></label>
  <p id="after">Right after the field.</p>
  <label>Say it <input type="file" name="voice" id="voice" accept="audio/*" capture></label>
  <button id="send" name="action" value="Send">Send</button>
</form>

<p><textarea id="loose" aria-label="Outside any form"></textarea></p>

<p>
  <button id="speak" type="button">Speak (keepAudio)</button>
  <button id="speak-late" type="button">Speak in 6 s (no gesture then)</button>
  <button id="probe" type="button">Probe activation</button>
  <output id="voice-result"></output>
</p>

<p>
  <input type="file" id="pick" multiple>
  <button id="start-files" type="button">Start with files</button>
  <output id="start-result"></output>
</p>

<div id="embed-box"></div>

<script>
  const out = (id, value) => { document.getElementById(id).textContent = typeof value === "string" ? value : JSON.stringify(value); };
  async function speak() {
    try {
      const result = await window.threadPage.invoke("voice.captureAndTranscribe", { keepAudio: true, prompt: "the page asked" });
      out("voice-result", { ok: true, text: result.text, audioType: result.audio ? result.audio.type : null, audioSize: result.audio ? result.audio.size : 0 });
    } catch (error) {
      out("voice-result", { ok: false, code: error.code, message: error.message });
    }
  }
  document.getElementById("speak").addEventListener("click", speak);
  document.getElementById("speak-late").addEventListener("click", () => setTimeout(speak, 6000));
  // The shell's own document sees the reader's gesture here: its test hook records isActive on this message.
  document.getElementById("probe").addEventListener("click", () => parent.postMessage({ kind: "voice-pass:probe" }, "*"));
  setTimeout(() => parent.postMessage({ kind: "voice-pass:probe-idle" }, "*"), 1500);
  document.getElementById("start-files").addEventListener("click", async () => {
    try {
      const result = await window.threadPage.invoke("sessions.start", { projectId: "proj_a", prompt: "Look at these", files: document.getElementById("pick") });
      out("start-result", { ok: true, result });
    } catch (error) {
      out("start-result", { ok: false, code: error.code, message: error.message });
    }
  });
  window.threadPage.embed(document.getElementById("embed-box"), { sessionId: document.body.dataset.session || "thr_voice", path: "embedded.html" });
</script>
</body>
</html>
